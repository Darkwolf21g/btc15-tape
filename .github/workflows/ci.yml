name: Application checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Dependency advisory report
        continue-on-error: true
        run: |
          mkdir -p .audit-artifacts
          audit_exit=0
          npm audit --json > .audit-artifacts/npm-audit.json || audit_exit=$?
          node -e "const r=require('./.audit-artifacts/npm-audit.json'); console.log(JSON.stringify({error:r.error,vulnerabilities:r.metadata?.vulnerabilities}));"
          exit "$audit_exit"
      - run: npm run check
      - run: node --test --test-isolation=none tests/*.test.cjs
      - name: Worker dry run and SQLite endpoint tests
        run: npm run test:runtime
      - run: node tests/websocket-runtime.mjs
      - run: node tests/alarm-runtime.mjs
      - name: Install browser test dependencies
        run: |
          python3 -m venv /tmp/btc15-browser-env
          /tmp/btc15-browser-env/bin/python -m pip install -r test/requirements.txt
          /tmp/btc15-browser-env/bin/python -m playwright install --with-deps chromium
      - name: Browser smoke tests with local fixtures
        run: /tmp/btc15-browser-env/bin/python tests/browser-smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit-artifacts
          path: .audit-artifacts/
