name: Kalshi market scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node scripts/scan-markets.mjs
      - name: Summary to log
        run: |
          echo "::group::SUMMARY.md"; cat scan/SUMMARY.md; echo "::endgroup::"
          echo "::group::series.json"; cat scan/series.json; echo "::endgroup::"
      - name: Publish results to the scan-results branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          tmp=$(mktemp -d); cp -r scan "$tmp/$stamp"; cd "$tmp"
          git init -q -b scan-results; git config user.name scan-bot; git config user.email scan-bot@users.noreply.github.com
          git add -A; git commit -q -m "scan $stamp"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" scan-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kalshi-scan
          path: scan/
          retention-days: 14
