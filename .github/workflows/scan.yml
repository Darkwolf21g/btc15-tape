name: Kalshi market scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node scripts/scan-markets.mjs
      - name: Summary to log
        run: |
          echo "::group::SUMMARY.md"; cat scan/SUMMARY.md; echo "::endgroup::"
          echo "::group::series.json"; cat scan/series.json; echo "::endgroup::"
      - name: Publish results to the scan-results branch
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -o pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          gh api -X POST "repos/$R/git/refs" -f ref=refs/heads/scan-results -f sha="$GITHUB_SHA" 2>&1 | tail -c 300 || true
          for f in SUMMARY.md series.json markets.json; do
            sha=$(gh api "repos/$R/contents/scan/$f?ref=scan-results" --jq .sha 2>/dev/null || true)
            base64 -w0 "scan/$f" > /tmp/b64
            if ! out=$(gh api -X PUT "repos/$R/contents/scan/$f" -f message="scan $stamp: $f" -f branch=scan-results -F content=@/tmp/b64 ${sha:+-f sha=$sha} 2>&1); then
              echo "::error::publish $f failed: $(echo "$out" | tail -c 400)"; exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kalshi-scan
          path: scan/
          retention-days: 14
